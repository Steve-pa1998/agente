<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 800px;
    height: 800px;
    overflow: hidden;
    background: #1a2744;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    position: relative;
    width: 760px;
    height: 760px;
  }
  /* Anillo verde */
  .ring {
    position: absolute;
    width: 760px;
    height: 760px;
    border-radius: 50%;
    border: 10px solid #4CAF50;
  }
  /* Foto recortada en círculo */
  .photo {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 740px;
    height: 740px;
    border-radius: 50%;
    overflow: hidden;
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="ring"></div>
    <div class="photo">
      <!-- ⬇️ CAMBIA ESTO POR LA RUTA DE TU FOTO ⬇️ -->
      <img src="mi_foto.jpg" alt="perfil">
    </div>
  </div>
</body>
</html>
